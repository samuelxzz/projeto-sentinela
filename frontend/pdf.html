<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Documentos do Paciente</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        #lista-pdfs {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .pdf-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;

            padding: 18px;

            border: 1px solid #ddd;
            border-radius: 12px;

            background: #fafafa;
        }

        .pdf-nome {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .btn-baixar {
            background: #3498db;
            color: white;

            border: none;
            border-radius: 8px;

            padding: 10px 18px;

            cursor: pointer;

            text-decoration: none;

            font-size: 14px;
        }

        .btn-baixar:hover {
            background: #2980b9;
        }

        .mensagem {
            text-align: center;
            color: #777;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>📄 Documentos do Paciente</h2>

        <div id="lista-pdfs">
            <div class="mensagem">
                Carregando PDFs...
            </div>
        </div>

    </div>

    <script>

        const params = new URLSearchParams(window.location.search);

        const paciente = params.get("paciente");

        const lista = document.getElementById("lista-pdfs");


        function carregarPDFs() {

            let url = "/pdfs";

            if (paciente) {
                url += "?paciente=" +
                    encodeURIComponent(paciente);
            }

            fetch(url)

                .then(response => {

                    if (!response.ok) {
                        throw new Error("Erro ao buscar PDFs");
                    }

                    return response.json();

                })

                .then(pdfs => {

                    lista.innerHTML = "";

                    if (!pdfs || pdfs.length === 0) {

                        lista.innerHTML = `
                            <div class="mensagem">
                                Nenhum PDF encontrado para este paciente.
                            </div>
                        `;

                        return;
                    }


                    pdfs.forEach(pdf => {

                        const card =
                            document.createElement("div");

                        card.className = "pdf-card";


                        const nome =
                            document.createElement("span");

                        nome.className = "pdf-nome";

                        nome.textContent =
                            pdf.nome;


                        const botao =
                            document.createElement("a");

                        botao.className = "btn-baixar";

                        botao.textContent =
                            "⬇️ Baixar PDF";

                        botao.href = pdf.url;

                        botao.download = pdf.nome;


                        card.appendChild(nome);

                        card.appendChild(botao);

                        lista.appendChild(card);

                    });

                })

                .catch(error => {

                    console.error(error);

                    lista.innerHTML = `
                        <div class="mensagem">
                            ❌ Não foi possível carregar os PDFs.
                        </div>
                    `;

                });
        }


        carregarPDFs();

    </script>

</body>

</html>
