<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Documentos do Paciente</title>

    <link rel="stylesheet"
          href="css/1style.css">

    <style>

        body {
            min-height: 100vh;
            height: auto !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
        }

        .pdf-container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .pdf-card {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .pdf-card h3 {
            margin-top: 0;
        }

        .btn-pdf-abrir {
            display: inline-block;
            padding: 12px 18px;
            margin-top: 10px;
            background: #e91e63;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn-pdf-abrir:hover {
            background: #c2185b;
        }

        .btn-voltar {
            display: inline-block;
            padding: 12px 18px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
        }

    </style>

</head>


<body>

    <div class="pdf-container">

        <a
            href="medico.html"
            class="btn-voltar"
        >
            ← Voltar para o Médico
        </a>


        <div class="pdf-card">

            <h1>
                📄 Documentos do Paciente
            </h1>

            <h2 id="nome-paciente">
                Carregando...
            </h2>

        </div>


        <div id="lista-pdfs">

            <div class="pdf-card">

                <p>
                    ⏳ Carregando documentos...
                </p>

            </div>

        </div>

    </div>


<script>

    /* =========================
       PEGAR PACIENTE DA URL
    ========================= */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const paciente =
        params.get("paciente");


    /* =========================
       MOSTRAR NOME
    ========================= */

    const nomePaciente =
        document.getElementById(
            "nome-paciente"
        );


    if (paciente) {

        nomePaciente.textContent =
            "Paciente: " + paciente;

    } else {

        nomePaciente.textContent =
            "Paciente não informado";

    }


    /* =========================
       CARREGAR PDFs
    ========================= */

    async function carregarPDFs() {

        const lista =
            document.getElementById(
                "lista-pdfs"
            );


        if (!paciente) {

            lista.innerHTML = `
                <div class="pdf-card">
                    <h3>❌ Nenhum paciente selecionado</h3>
                </div>
            `;

            return;
        }


        try {

            const resposta =
                await fetch(
                    "http://localhost:3000/pdfs?paciente=" +
                    encodeURIComponent(paciente)
                );


            if (!resposta.ok) {

                throw new Error(
                    "Erro na rota /pdfs"
                );

            }


            const pdfs =
                await resposta.json();


            if (
                !pdfs ||
                pdfs.length === 0
            ) {

                lista.innerHTML = `
                    <div class="pdf-card">

                        <h3>
                            📂 Nenhum PDF encontrado
                        </h3>

                        <p>
                            Este paciente não possui
                            documentos cadastrados.
                        </p>

                    </div>
                `;

                return;
            }


            lista.innerHTML = "";


            pdfs.forEach(pdf => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "pdf-card";


                card.innerHTML = `

                    <h3>
                        📄 ${pdf.nome || "Documento"}
                    </h3>

                    <a
                        href="${pdf.url}"
                        target="_blank"
                        class="btn-pdf-abrir"
                    >
                        👁️ Abrir PDF
                    </a>

                `;


                lista.appendChild(card);

            });


        } catch (erro) {

            console.error(erro);


            lista.innerHTML = `

                <div class="pdf-card">

                    <h3>
                        ❌ Não foi possível carregar os PDFs
                    </h3>

                    <p>
                        O arquivo pdfs.html está funcionando,
                        mas o servidor ainda precisa possuir
                        a rota:
                    </p>

                    <strong>
                        GET /pdfs?paciente=...
                    </strong>

                </div>

            `;

        }

    }


    carregarPDFs();

</script>

</body>

</html>
