<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Alta do Paciente</title>

    <link
        rel="stylesheet"
        href="css/1style.css"
    >

    <style>

        html,
        body {
            min-height: 100%;
            height: auto !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
        }

        body {
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .alta-container {

            width: 90%;
            max-width: 800px;

            margin: 30px auto;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.12);

        }

        .alta-container h1 {

            text-align: center;

            margin-top: 0;

            color: #e91e63;

        }

        .campo {

            margin-bottom: 18px;

        }

        .campo label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;

        }

        .campo input,
        .campo select,
        .campo textarea {

            width: 100%;

            padding: 12px;

            box-sizing: border-box;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

        }

        .campo textarea {

            min-height: 100px;

            resize: vertical;

        }

        .botoes {

            display: flex;

            gap: 12px;

            margin-top: 25px;

        }

        .btn {

            flex: 1;

            border: none;

            padding: 14px;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            text-decoration: none;

            text-align: center;

            box-sizing: border-box;

        }

        .btn-alta {

            background: #e91e63;

            color: white;

        }

        .btn-alta:hover {

            background: #c2185b;

        }

        .btn-voltar {

            background: #3498db;

            color: white;

        }

        .btn-voltar:hover {

            background: #2980b9;

        }

        .mensagem {

            display: none;

            padding: 12px;

            margin-top: 20px;

            border-radius: 8px;

            text-align: center;

            font-weight: bold;

        }

        .sucesso {

            display: block;

            background: #d4edda;

            color: #155724;

        }

        .erro {

            display: block;

            background: #f8d7da;

            color: #721c24;

        }

        @media (max-width: 600px) {

            .alta-container {

                width: 100%;

                padding: 20px;

                box-sizing: border-box;

            }

            .botoes {

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


<div class="alta-container">

    <h1>
        🏥 Alta do Paciente
    </h1>


    <form id="form-alta">


        <div class="campo">

            <label for="paciente">
                Paciente *
            </label>

            <select
                id="paciente"
                required
            >

                <option value="">
                    Carregando pacientes...
                </option>

            </select>

        </div>


        <div class="campo">

            <label for="tipoAlta">
                Tipo de Alta *
            </label>

            <select
                id="tipoAlta"
                required
            >

                <option value="">
                    Selecione
                </option>

                <option value="Alta médica">
                    Alta médica
                </option>

                <option value="Alta administrativa">
                    Alta administrativa
                </option>

                <option value="Alta a pedido">
                    Alta a pedido
                </option>

                <option value="Transferência">
                    Transferência
                </option>

                <option value="Óbito">
                    Óbito
                </option>

            </select>

        </div>


        <div class="campo">

            <label for="motivo">
                Motivo da Alta *
            </label>

            <textarea
                id="motivo"
                placeholder="Informe o motivo da alta..."
                required
            ></textarea>

        </div>


        <div class="campo">

            <label for="orientacoes">
                Orientações
            </label>

            <textarea
                id="orientacoes"
                placeholder="Informe as orientações para o paciente..."
            ></textarea>

        </div>


        <div class="campo">

            <label for="observacoes">
                Observações
            </label>

            <textarea
                id="observacoes"
                placeholder="Observações adicionais..."
            ></textarea>

        </div>


        <div class="botoes">

            <a
                href="medico.html"
                class="btn btn-voltar"
            >
                ← Voltar
            </a>

            <button
                type="submit"
                class="btn btn-alta"
                id="btn-alta"
            >
                📄 Registrar Alta e Baixar PDF
            </button>

        </div>


    </form>


    <div
        id="mensagem"
        class="mensagem"
    ></div>


</div>


<script>


// ==========================================
// ELEMENTOS
// ==========================================

const form =
    document.getElementById("form-alta");

const selectPaciente =
    document.getElementById("paciente");

const tipoAlta =
    document.getElementById("tipoAlta");

const motivo =
    document.getElementById("motivo");

const orientacoes =
    document.getElementById("orientacoes");

const observacoes =
    document.getElementById("observacoes");

const mensagem =
    document.getElementById("mensagem");

const btnAlta =
    document.getElementById("btn-alta");


// ==========================================
// MENSAGEM
// ==========================================

function mostrarMensagem(
    texto,
    tipo
) {

    mensagem.textContent = texto;

    mensagem.className =
        "mensagem " + tipo;

}


// ==========================================
// CARREGAR PACIENTES
// ==========================================

async function carregarPacientes() {

    try {

        const resposta =
            await fetch(
                "http://localhost:3000/pacientes"
            );

        if (!resposta.ok) {

            throw new Error(
                "Erro ao buscar pacientes."
            );
        }

        const pacientes =
            await resposta.json();


        selectPaciente.innerHTML = "";

        const opcaoInicial =
            document.createElement("option");

        opcaoInicial.value = "";

        opcaoInicial.textContent =
            "Selecione o paciente";

        selectPaciente.appendChild(
            opcaoInicial
        );


        if (
            !Array.isArray(pacientes) ||
            pacientes.length === 0
        ) {

            selectPaciente.innerHTML = `
                <option value="">
                    Nenhum paciente cadastrado
                </option>
            `;

            return;
        }


        pacientes.forEach(
            paciente => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    paciente.nome || "";

                option.textContent =
                    paciente.nome || "Sem nome";

                selectPaciente.appendChild(
                    option
                );
            }
        );


    } catch (erro) {

        console.error(erro);

        selectPaciente.innerHTML = `
            <option value="">
                Erro ao carregar pacientes
            </option>
        `;

        mostrarMensagem(
            "Não foi possível carregar os pacientes.",
            "erro"
        );
    }
}


// ==========================================
// REGISTRAR ALTA
// ==========================================

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const paciente =
            selectPaciente.value;

        const tipo =
            tipoAlta.value;

        const motivoTexto =
            motivo.value.trim();

        const orientacoesTexto =
            orientacoes.value.trim();

        const observacoesTexto =
            observacoes.value.trim();


        if (!paciente) {

            mostrarMensagem(
                "Selecione um paciente.",
                "erro"
            );

            return;
        }


        if (!tipo) {

            mostrarMensagem(
                "Selecione o tipo de alta.",
                "erro"
            );

            return;
        }


        if (!motivoTexto) {

            mostrarMensagem(
                "Informe o motivo da alta.",
                "erro"
            );

            return;
        }


        btnAlta.disabled = true;

        btnAlta.textContent =
            "⏳ Gerando PDF...";


        try {

            const resposta =
                await fetch(
                    "http://localhost:3000/alta",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                paciente,

                                tipoAlta: tipo,

                                motivo:
                                    motivoTexto,

                                orientacoes:
                                    orientacoesTexto,

                                observacoes:
                                    observacoesTexto
                            })
                    }
                );


            const dados =
                await resposta.json();


            if (!resposta.ok) {

                throw new Error(
                    dados.erro ||
                    "Erro ao registrar a alta."
                );
            }


            mostrarMensagem(
                "✅ Alta registrada! O PDF será baixado.",
                "sucesso"
            );


            // ==================================
            // BAIXAR PDF AUTOMATICAMENTE
            // ==================================

            if (dados.pdf) {

                const link =
                    document.createElement("a");

                link.href =
                    "http://localhost:3000" +
                    dados.pdf;

                link.download =
                    dados.arquivo ||
                    "alta.pdf";

                link.style.display =
                    "none";

                document.body.appendChild(
                    link
                );

                link.click();

                document.body.removeChild(
                    link
                );
            }


            // Limpar formulário

            form.reset();


            // Recarregar pacientes

            await carregarPacientes();


        } catch (erro) {

            console.error(erro);

            mostrarMensagem(
                erro.message ||
                "Erro ao registrar a alta.",
                "erro"
            );

        } finally {

            btnAlta.disabled = false;

            btnAlta.textContent =
                "📄 Registrar Alta e Baixar PDF";
        }

    }
);


// ==========================================
// INICIAR
// ==========================================

carregarPacientes();

</script>


</body>

</html>
