<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/1style.css">

  <title>Hospital - Login</title>
</head>

<body>

  <div class="container">

    <div class="logo-area">
      <img src="img/logo-hospital.png" alt="Logo do Hospital">

      <h2>Hospital</h2>
      <p>Sistema Hospitalar</p>
    </div>

    <div class="formulario">

      <input id="usuario" type="text" placeholder="Usuário">

      <input id="senha" type="password" placeholder="Senha">

      <button onclick="login()">Entrar</button>

    </div>

  </div>

  <script>
    function login() {

      fetch("/login", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
        usuario: usuario.value,
          senha: senha.value
        })
      })

      .then(r => r.json())

      .then(data => {

        if (data.tipo === "triagem") {
          location.href = "triagem.html";
        }

        if (data.tipo === "medico") {
          location.href = "medico.html";
        }

        if (data.tipo === "atendimento") {
          location.href = "atendimento.html";
        }

      })

      .catch(error => {
        console.error("Erro no login:", error);
        alert("Não foi possível conectar ao servidor.");
      });

    }
  </script>

</body>
</html>
