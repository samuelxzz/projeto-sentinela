
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Médico</title>

    <link rel="stylesheet" href="css/1style.css">

    <style>

        html, body {
            height: auto !important;
            min-height: 100% !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
        }

        body {
            min-height: 100vh !important;
        }

        .lista-pacientes {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0 35px;
        }

        .paciente-card {
            background: #fff;
            border: 1px solid #e0e6ef;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 14px rgba(0,0,0,.07);
        }

        .paciente-card h3 {
            margin: 0 0 10px;
            color: #172033;
        }

        .paciente-card p {
            margin: 7px 0;
        }

        .acoes-paciente {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .acoes-paciente button {
            width: auto !important;
            margin-top: 0 !important;
            border: 0;
            border-radius: 10px;
            padding: 12px 16px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-atender {
            background: #3498db;
        }

        .btn-tv {
            background: #8e44ad;
        }

        /* BOTÃO INTERNAR */

        .btn-internar {
            background: #3498db;
        }

        .btn-internar:hover {
            background: #2980b9;
        }

        /* BOTÃO DAR ALTA */

        .btn-alta {
            background: #2ecc71;
        }

        .btn-alta:hover {
            background: #27ae60;
        }

        /* FORMULÁRIO DE ALTA */

        .form-alta {
            display: none;
            background: #f8fafc;
            border: 1px solid #dfe6ee;
            border-radius: 14px;
            padding: 20px;
            margin: 20px 0;
        }

        .form-alta h3 {
            margin-top: 0;
            color: #172033;
        }

        .form-alta label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        .form-alta input,
        .form-alta textarea,
        .form-alta select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccd7e5;
            border-radius: 9px;
            font-size: 15px;
        }

        .form-alta textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn-confirmar-alta {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 14px;
            margin-top: 18px;
            background: #2ecc71;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-confirmar-alta:hover {
            background: #27ae60;
        }

        .btn-cancelar-alta {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
            background: #e74c3c;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancelar-alta:hover {
            background: #c0392b;
        }

        /* BOTÃO PDF */

        .btn-pdf {
            display: none;
            width: 100%;
            margin: 15px 0;
            border: 0;
            border-radius: 10px;
            padding: 14px;
            background: #e91e63;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-pdf:hover {
            background: #c2185b;
        }

        .mensagem {
            background: #fff;
            border-radius: 14px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
        }

        .erro {
            color: #a61b36;
            background: #fff1f3;
        }

        .select-paciente {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccd7e5;
            border-radius: 10px;
            font-size: 16px;
            background: #f8fafc;
            margin: 8px 0 18px;
        }

        .btn-salvar {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 14px;
            background: #3498db;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-salvar:hover {
            background: #2980b9;
        }

        .alta-sucesso {
            display: none;
            background: #eafaf1;
            color: #1e8449;
            border: 1px solid #a9dfbf;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
            font-weight: bold;
        }

        /* LISTA DE PACIENTES INTERNADOS */

        .lista-internados {
            display: none;
            background: #ffffff;
            border: 1px solid #dbe5ef;
            border-radius: 14px;
            padding: 20px;
            margin: 20px 0 35px;
            box-shadow: 0 4px 14px rgba(0,0,0,.07);
        }

        .lista-internados h2 {
            margin-top: 0;
            color: #172033;
        }

        .paciente-internado {
            background: #f8fafc;
            border: 1px solid #dfe6ee;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .paciente-internado:last-child {
            margin-bottom: 0;
        }

        .status-internado {
            display: inline-block;
            margin-top: 8px;
            padding: 5px 10px;
            border-radius: 20px;
            background: #2ecc71;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
        }

        .btn-fechar-internados {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 12px;
            margin-top: 15px;
            background: #e74c3c;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-fechar-internados:hover {
            background: #c0392b;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>🩺 Painel Médico</h1>

    <a href="tv.html" target="_blank">📺 Abrir Tela da TV</a>

    <div class="consultorio-input">

        <label for="consultorio-num">
            🏥 <strong>Número do consultório:</strong>
        </label>

        <input
            type="number"
            id="consultorio-num"
            placeholder="Ex: 1"
            min="1"
        >

    </div>

    <h2>🏥 👥 Pacientes aguardando atendimento</h2>

    <div id="triagens" class="lista-pacientes">

        <div class="mensagem">
            ⏳ Carregando pacientes...
        </div>

    </div>


    <!-- LISTA DE PACIENTES INTERNADOS -->

    <div id="lista-internados" class="lista-internados">

        <h2>🏥 Pacientes Internados</h2>

        <div id="pacientes-internados">
            <div class="mensagem">⏳ Carregando pacientes internados...</div>
        </div>

        <button
            type="button"
            class="btn-fechar-internados"
            onclick="fecharListaInternados()"
        >
            ❌ Fechar lista
        </button>

    </div>


    <div class="consulta-area">

        <h2>🏥 🩺 Consulta</h2>

        <label for="paciente">
            <strong>Paciente:</strong>
        </label>

        <select id="paciente" class="select-paciente">

            <option value="">
                Selecione um paciente
            </option>

        </select>


        <!-- FORMULÁRIO DE ALTA -->

        <div id="form-alta" class="form-alta">

            <h3>🟢 Formulário de Alta</h3>

            <p>
                <strong>Paciente:</strong>
                <span id="nome-alta"></span>
            </p>

            <label for="tipo-alta">
                Tipo de alta:
            </label>

            <select id="tipo-alta">

                <option value="">
                    Selecione
                </option>

                <option value="Alta médica">
                    Alta médica
                </option>

                <option value="Alta a pedido">
                    Alta a pedido
                </option>

                <option value="Transferência">
                    Transferência
                </option>

            </select>


            <label for="motivo-alta">
                Motivo da alta:
            </label>

            <input
                type="text"
                id="motivo-alta"
                placeholder="Digite o motivo da alta"
            >


            <label for="orientacoes-alta">
                Orientações ao paciente:
            </label>

            <textarea
                id="orientacoes-alta"
                placeholder="Digite as orientações para o paciente"
            ></textarea>


            <label for="observacoes-alta">
                Observações:
            </label>

            <textarea
                id="observacoes-alta"
                placeholder="Digite outras observações"
            ></textarea>


            <button
                class="btn-confirmar-alta"
                type="button"
                onclick="confirmarAlta()"
            >
                ✅ Confirmar Alta
            </button>

            <button
                class="btn-cancelar-alta"
                type="button"
                onclick="cancelarAlta()"
            >
                ❌ Cancelar
            </button>

        </div>


        <!-- MENSAGEM DE ALTA -->

        <div id="alta-sucesso" class="alta-sucesso">

            ✅ Alta registrada com sucesso!

        </div>


        <!-- BOTÃO PDF -->

        <button
            id="btn-pdf"
            class="btn-pdf"
            type="button"
            onclick="gerarPDFPaciente()"
        >
            📄 Gerar PDF do Paciente
        </button>


        <label for="diagnostico">
            <strong>Diagnóstico:</strong>
        </label>

        <input
            type="text"
            id="diagnostico"
            placeholder="Digite o diagnóstico"
        >


        <label for="medicacao">
            <strong>💊 Medicação:</strong>
        </label>

        <select id="medicacao">

            <option value="">
                Selecione uma medicação
            </option>

        </select>


        <label for="obs">
            <strong>📝 Observações:</strong>
        </label>

        <textarea
            id="obs"
            placeholder="Observações da consulta"
        ></textarea>


        <button
            class="btn-salvar"
            type="button"
            onclick="salvar()"
        >
            💾 Salvar Consulta
        </button>

    </div>

</div>


<script>

const API = "";

let triagensCarregadas = [];
let pacienteSelecionado = "";
let altaConfirmada = false;


/* CARREGAR PACIENTES */

async function carregar() {

    const div = document.getElementById("triagens");

    try {

        const resposta =
            await fetch(API + "/triagens?_" + Date.now());

        if (!resposta.ok) {

            throw new Error(
                "Erro HTTP " + resposta.status
            );

        }

        const dados =
            await resposta.json();

        triagensCarregadas =
            Array.isArray(dados) ? dados : [];

        renderizarPacientes();

    }

    catch (erro) {

        console.error(erro);

        div.innerHTML = `

            <div class="mensagem erro">

                ❌ Não foi possível carregar os pacientes.

                <br><br>

                Verifique se o <b>server.js</b>
                está ligado na porta 3000.

                <br><br>

                Erro:
                ${escapeHtml(erro.message)}

                <br><br>

                <button
                    class="btn-atender"
                    onclick="carregar()"
                >
                    🔄 Tentar novamente
                </button>

            </div>

        `;

    }

}


/* MOSTRAR PACIENTES */

function renderizarPacientes() {

    const div =
        document.getElementById("triagens");

    const select =
        document.getElementById("paciente");

    div.innerHTML = "";

    select.innerHTML =
        '<option value="">Selecione um paciente</option>';


    if (triagensCarregadas.length === 0) {

        div.innerHTML = `

            <div class="mensagem">

                👥 Nenhum paciente aguardando atendimento.

            </div>

        `;

        return;

    }


    triagensCarregadas.forEach(
        (p, index) => {

        const nome =
            p.nome || "Paciente sem nome";


        /* SELECT */

        const option =
            document.createElement("option");

        option.value = nome;

        option.textContent = nome;

        option.dataset.index = index;

        select.appendChild(option);


        /* CARD */

        const card =
            document.createElement("div");

        card.className =
            "paciente-card";


        card.innerHTML = `

            <h3>
                👤 ${escapeHtml(nome)}
            </h3>

            <p>
                <strong>🩺 Sintoma:</strong>
                ${escapeHtml(
                    p.sintoma || "Não informado"
                )}
            </p>

            <p>
                <strong>🌡️ Temperatura:</strong>
                ${escapeHtml(
                    String(
                        p.temperatura ??
                        "Não informada"
                    )
                )}
                ${p.temperatura !== "" ? " °C" : ""}
            </p>

            <p>
                <strong>🚦 Risco:</strong>
                ${escapeHtml(
                    p.risco || "Não informado"
                )}
            </p>

            <p>
                <strong>💊 Alergia:</strong>
                ${escapeHtml(
                    p.alergia ||
                    "Nenhuma informada"
                )}
            </p>

            <p>
                <strong>📝 Observação:</strong>
                ${escapeHtml(
                    p.observacao || "Nenhuma"
                )}
            </p>


            <div class="acoes-paciente">

                <button
                    class="btn-atender"
                    onclick="selecionar(${index})"
                >
                    🩺 Atender
                </button>


                <button
                    class="btn-tv"
                    onclick="chamarNaTV(${index})"
                >
                    📺 Chamar na TV
                </button>


                <button
                    class="btn-alta"
                    onclick="abrirFormularioAlta(${index})"
                >
                    🟢 Dar Alta
                </button>


                <button
                    class="btn-internar"
                    onclick="internarPaciente(${index})"
                >
                    🏥 Internar
                </button>

            </div>

        `;


        div.appendChild(card);

    });

}


/* SELECT */

document
    .getElementById("paciente")
    .addEventListener(
        "change",
        function() {

        const index =
            this.options[
                this.selectedIndex
            ].dataset.index;

        if (index !== undefined) {

            selecionar(
                Number(index)
            );

        }

    });


/* SELECIONAR PACIENTE */

function selecionar(index) {

    const paciente =
        triagensCarregadas[index];


    if (!paciente) {

        alert(
            "Paciente não encontrado."
        );

        return;

    }


    pacienteSelecionado =
        paciente.nome || "";


    const select =
        document.getElementById(
            "paciente"
        );

    select.value =
        pacienteSelecionado;


    document.getElementById(
        "obs"
    ).value =
        paciente.observacao || "";


    if (paciente.alergia) {

        alert(

            "⚠️ ATENÇÃO!\n\n" +

            "Alergia do paciente: " +

            paciente.alergia

        );

    }


    document
        .querySelector(
            ".consulta-area"
        )
        .scrollIntoView({

            behavior: "smooth",

            block: "start"

        });

}


/* ABRIR FORMULÁRIO DE ALTA */

function abrirFormularioAlta(index) {

    const paciente =
        triagensCarregadas[index];


    if (!paciente) {

        alert(
            "Paciente não encontrado."
        );

        return;

    }


    pacienteSelecionado =
        paciente.nome || "";


    document.getElementById(
        "paciente"
    ).value =
        pacienteSelecionado;


    document.getElementById(
        "nome-alta"
    ).textContent =
        pacienteSelecionado;


    document.getElementById(
        "form-alta"
    ).style.display =
        "block";


    document.getElementById(
        "alta-sucesso"
    ).style.display =
        "none";


    document.getElementById(
        "btn-pdf"
    ).style.display =
        "none";


    document
        .getElementById(
            "form-alta"
        )
        .scrollIntoView({

            behavior: "smooth",

            block: "start"

        });

}


/* CANCELAR ALTA */

function cancelarAlta() {

    document.getElementById(
        "form-alta"
    ).style.display =
        "none";

}


/* CONFIRMAR ALTA */

async function confirmarAlta() {

    if (!pacienteSelecionado) {

        alert(
            "Selecione um paciente."
        );

        return;

    }


    const tipoAlta =
        document.getElementById(
            "tipo-alta"
        ).value;


    const motivo =
        document.getElementById(
            "motivo-alta"
        ).value;


    const orientacoes =
        document.getElementById(
            "orientacoes-alta"
        ).value;


    const observacoes =
        document.getElementById(
            "observacoes-alta"
        ).value;


    if (!tipoAlta) {

        alert(
            "Selecione o tipo de alta."
        );

        return;

    }


    if (!motivo.trim()) {

        alert(
            "Digite o motivo da alta."
        );

        return;

    }


    try {

        const resposta =
            await fetch(
                API + "/alta",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        paciente:
                            pacienteSelecionado,

                        tipoAlta:
                            tipoAlta,

                        motivo:
                            motivo,

                        orientacoes:
                            orientacoes,

                        observacoes:
                            observacoes

                    })
                }
            );


        if (!resposta.ok) {

            throw new Error(
                "Erro HTTP " +
                resposta.status
            );

        }


        altaConfirmada = true;


        document.getElementById(
            "form-alta"
        ).style.display =
            "none";


        document.getElementById(
            "alta-sucesso"
        ).style.display =
            "block";


        /* PDF SÓ APARECE DEPOIS DA ALTA */

        document.getElementById(
            "btn-pdf"
        ).style.display =
            "block";


        alert(
            "✅ Alta registrada com sucesso!"
        );

    }

    catch (erro) {

        console.error(erro);

        alert(
            "❌ Não foi possível registrar a alta.\n\n" +
            erro.message
        );

    }

}


/* GERAR PDF DO PACIENTE */

async function gerarPDFPaciente() {

    if (!pacienteSelecionado) {

        alert(
            "⚠️ Primeiro selecione um paciente."
        );

        return;

    }


    if (!altaConfirmada) {

        alert(
            "⚠️ Primeiro confirme a alta do paciente."
        );

        return;

    }


    try {

        const resposta =
            await fetch(
                API + "/gerar-pdf?paciente=" +
                encodeURIComponent(
                    pacienteSelecionado
                )
            );


        const resultado =
            await resposta.json();


        if (!resposta.ok) {

            throw new Error(
                resultado.erro ||
                "Erro ao gerar o PDF."
            );

        }


        const link =
            document.createElement("a");

        link.href = resultado.url;

        link.download =
            resultado.nome ||
            "paciente.pdf";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        alert(
            "✅ PDF do paciente gerado e baixado!"
        );

    }

    catch (erro) {

        console.error(erro);

        alert(
            "❌ Não foi possível gerar o PDF.\n\n" +
            erro.message
        );

    }

}


/* INTERNAR PACIENTE */

async function internarPaciente(index) {

    const paciente =
        triagensCarregadas[index];


    if (!paciente) {

        alert(
            "❌ Paciente não encontrado."
        );

        return;

    }


    const confirmar = confirm(
        "🏥 Deseja internar o paciente " +
        paciente.nome +
        "?"
    );


    if (!confirmar) return;


    try {

        const resposta =
            await fetch(
                API + "/internacao",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        paciente: paciente.nome
                    })
                }
            );


        const resultado =
            await resposta.json();


        if (!resposta.ok) {

            throw new Error(
                resultado.erro ||
                "Erro ao realizar a internação."
            );

        }


        alert(
            "✅ Paciente " +
            paciente.nome +
            " internado com sucesso!"
        );

        await carregar();

        await abrirListaInternados();

    }

    catch (erro) {

        console.error(erro);

        alert(
            "❌ Não foi possível realizar a internação.\n\n" +
            erro.message
        );

    }

}


/* ABRIR LISTA DE PACIENTES INTERNADOS */

async function abrirListaInternados() {

    const lista =
        document.getElementById("lista-internados");

    const container =
        document.getElementById("pacientes-internados");

    lista.style.display = "block";

    container.innerHTML = `
        <div class="mensagem">
            ⏳ Carregando pacientes internados...
        </div>
    `;

    lista.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

    try {

        const resposta =
            await fetch(
                API + "/internacoes?_=" + Date.now()
            );

        if (!resposta.ok) {
            throw new Error(
                "Erro HTTP " + resposta.status
            );
        }

        const internacoes =
            await resposta.json();

        if (
            !Array.isArray(internacoes) ||
            internacoes.length === 0
        ) {
            container.innerHTML = `
                <div class="mensagem">
                    🏥 Nenhum paciente internado.
                </div>
            `;
            return;
        }

        container.innerHTML = "";

        internacoes.forEach(internacao => {

            const card =
                document.createElement("div");

            card.className = "paciente-internado";

            const data = internacao.createdAt
                ? new Date(internacao.createdAt)
                    .toLocaleString("pt-BR")
                : "Data não informada";

            card.innerHTML = `
                <strong>👤 ${escapeHtml(
                    internacao.paciente ||
                    "Paciente sem nome"
                )}</strong>
                <br>
                <span class="status-internado">
                    🟢 ${escapeHtml(
                        internacao.status || "internado"
                    )}
                </span>
                <br><br>
                <small>📅 ${escapeHtml(data)}</small>
            `;

            container.appendChild(card);
        });

    } catch (erro) {

        console.error(
            "Erro ao carregar internações:",
            erro
        );

        container.innerHTML = `
            <div class="mensagem erro">
                ❌ Não foi possível carregar os pacientes internados.
                <br><br>
                ${escapeHtml(erro.message)}
            </div>
        `;
    }
}


/* FECHAR LISTA DE INTERNADOS */

function fecharListaInternados() {

    document.getElementById(
        "lista-internados"
    ).style.display = "none";
}


/* CHAMAR NA TV */

async function chamarNaTV(index) {

    const paciente =
        triagensCarregadas[index];


    if (!paciente) return;


    const consultorio =
        document.getElementById(
            "consultorio-num"
        ).value;


    if (!consultorio) {

        alert(
            "Digite o número do consultório."
        );

        return;

    }


    try {

        const resposta =
            await fetch(
                API + "/tv/chamar",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        localTipo:
                            "CONSULTÓRIO",

                        localNumero:
                            consultorio,

                        paciente:
                            paciente.nome

                    })

                }
            );


        if (!resposta.ok) {

            throw new Error(
                "Erro HTTP " +
                resposta.status
            );

        }


        alert(

            "📺 " +

            paciente.nome +

            " foi chamado para o consultório " +

            consultorio +

            "."

        );

    }

    catch (erro) {

        alert(
            "❌ Não foi possível chamar o paciente na TV."
        );

    }

}


/* CARREGAR MEDICAÇÕES */

async function carregarMedicacoes() {

    const select =
        document.getElementById(
            "medicacao"
        );


    try {

        const resposta =
            await fetch(
                API + "/lista-medicacoes"
            );


        const medicamentos =
            await resposta.json();


        medicamentos.forEach(
            medicamento => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                medicamento;


            option.textContent =
                medicamento;


            select.appendChild(
                option
            );

        });

    }

    catch (erro) {

        console.error(
            "Erro ao carregar medicações:",
            erro
        );

    }

}


/* SALVAR CONSULTA */

async function salvar() {

    const paciente =
        document.getElementById(
            "paciente"
        ).value;


    const diagnostico =
        document.getElementById(
            "diagnostico"
        ).value;


    const medicacao =
        document.getElementById(
            "medicacao"
        ).value;


    const obs =
        document.getElementById(
            "obs"
        ).value;


    if (!paciente) {

        alert(
            "Selecione um paciente."
        );

        return;

    }


    if (!diagnostico) {

        alert(
            "Digite o diagnóstico."
        );

        return;

    }


    try {

        const resposta =
            await fetch(
                API + "/consulta",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        paciente,

                        diagnostico,

                        medicacao,

                        obs

                    })

                }
            );


        if (!resposta.ok) {

            throw new Error(
                "Erro HTTP " +
                resposta.status
            );

        }


        alert(
            "✅ Consulta salva com sucesso!"
        );


        document.getElementById(
            "diagnostico"
        ).value = "";


        document.getElementById(
            "medicacao"
        ).value = "";


        document.getElementById(
            "obs"
        ).value = "";


        await carregar();


        document.getElementById(
            "paciente"
        ).value = "";


        pacienteSelecionado = "";

        altaConfirmada = false;


        document.getElementById(
            "btn-pdf"
        ).style.display =
            "none";

    }

    catch (erro) {

        console.error(erro);

        alert(
            "❌ Não foi possível salvar a consulta."
        );

    }

}


/* SEGURANÇA */

function escapeHtml(valor) {

    return String(valor)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* INICIAR */

carregar();

carregarMedicacoes();

setInterval(
    carregar,
    10000
);

</script>
