<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Médico</title>
    <link rel="stylesheet" href="css/1style.css">

    <style>
        html, body {
            height: auto !important;
            min-height: 100% !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
        }

        body {
            min-height: 100vh !important;
        }

        .lista-pacientes {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0 35px;
        }

        .paciente-card {
            background: #fff;
            border: 1px solid #e0e6ef;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 14px rgba(0,0,0,.07);
        }

        .paciente-card h3 {
            margin: 0 0 10px;
            color: #172033;
        }

        .paciente-card p {
            margin: 7px 0;
        }

        .acoes-paciente {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .acoes-paciente button {
            width: auto !important;
            margin-top: 0 !important;
            border: 0;
            border-radius: 10px;
            padding: 12px 16px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-atender {
            background: #3498db;
        }

        .btn-tv {
            background: #8e44ad;
        }

        .btn-pdf {
            display: none;
            width: 100%;
            margin: 15px 0;
            border: 0;
            border-radius: 10px;
            padding: 14px;
            background: #e91e63;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-pdf:hover {
            background: #c2185b;
        }

        .mensagem {
            background: #fff;
            border-radius: 14px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
        }

        .erro {
            color: #a61b36;
            background: #fff1f3;
        }

        .select-paciente {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccd7e5;
            border-radius: 10px;
            font-size: 16px;
            background: #f8fafc;
            margin: 8px 0 18px;
        }

        .btn-salvar {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 14px;
            background: #2ecc71;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-salvar:hover {
            background: #27ae60;
        }

        #arquivo-pdf {
            display: none;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>🩺 Painel Médico</h1>

    <a href="tv.html" target="_blank">📺 Abrir Tela da TV</a>

    <div class="consultorio-input">
        <label for="consultorio-num">
            🏥 <strong>Número do consultório:</strong>
        </label>
        <input type="number" id="consultorio-num" placeholder="Ex: 1" min="1">
    </div>

    <h2>🏥 👥 Pacientes aguardando atendimento</h2>

    <div id="triagens" class="lista-pacientes">
        <div class="mensagem">⏳ Carregando pacientes...</div>
    </div>

    <div class="consulta-area">

        <h2>🏥 🩺 Consulta</h2>

        <label for="paciente"><strong>Paciente:</strong></label>

        <select id="paciente" class="select-paciente">
            <option value="">Selecione um paciente</option>
        </select>

        <!-- Botão para ENVIAR PDF -->
        <button id="btn-pdf" class="btn-pdf" type="button" onclick="abrirEnvioPDF()">
            📄 Enviar PDF do Paciente
        </button>

        <input
            type="file"
            id="arquivo-pdf"
            accept="application/pdf"
            onchange="enviarPDF()"
        >

        <label for="diagnostico"><strong>Diagnóstico:</strong></label>
        <input type="text" id="diagnostico" placeholder="Digite o diagnóstico">

        <label for="medicacao"><strong>💊 Medicação:</strong></label>
        <select id="medicacao">
            <option value="">Selecione uma medicação</option>
        </select>

        <label for="obs"><strong>📝 Observações:</strong></label>
        <textarea id="obs" placeholder="Observações da consulta"></textarea>

        <button class="btn-salvar" type="button" onclick="salvar()">
            💾 Salvar Consulta
        </button>

    </div>
</div>

<script>
const API = "";

let triagensCarregadas = [];
let pacienteSelecionado = "";

async function carregar() {
    const div = document.getElementById("triagens");

    try {
        const resposta = await fetch(API + "/triagens?_" + Date.now());

        if (!resposta.ok) {
            throw new Error("Erro HTTP " + resposta.status);
        }

        const dados = await resposta.json();

        triagensCarregadas = Array.isArray(dados) ? dados : [];

        renderizarPacientes();

    } catch (erro) {
        console.error(erro);

        div.innerHTML = `
            <div class="mensagem erro">
                ❌ Não foi possível carregar os pacientes.<br><br>
                Verifique se o <b>server.js</b> está ligado na porta 3000.
                <br><br>
                Erro: ${escapeHtml(erro.message)}
                <br><br>
                <button class="btn-atender" onclick="carregar()">
                    🔄 Tentar novamente
                </button>
            </div>
        `;
    }
}

function renderizarPacientes() {
    const div = document.getElementById("triagens");
    const select = document.getElementById("paciente");

    div.innerHTML = "";
    select.innerHTML = '<option value="">Selecione um paciente</option>';

    if (triagensCarregadas.length === 0) {
        div.innerHTML = `
            <div class="mensagem">
                👥 Nenhum paciente aguardando atendimento.
            </div>
        `;
        document.getElementById("btn-pdf").style.display = "none";
        return;
    }

    triagensCarregadas.forEach((p, index) => {

        const nome = p.nome || "Paciente sem nome";

        // Coloca o paciente no SELECT
        const option = document.createElement("option");
        option.value = nome;
        option.textContent = nome;
        option.dataset.index = index;
        select.appendChild(option);

        // Cria o card
        const card = document.createElement("div");
        card.className = "paciente-card";

        card.innerHTML = `
            <h3>👤 ${escapeHtml(nome)}</h3>

            <p>
                <strong>🩺 Sintoma:</strong>
                ${escapeHtml(p.sintoma || "Não informado")}
            </p>

            <p>
                <strong>🌡️ Temperatura:</strong>
                ${escapeHtml(String(p.temperatura ?? "Não informada"))}
                ${p.temperatura !== "" ? " °C" : ""}
            </p>

            <p>
                <strong>🚦 Risco:</strong>
                ${escapeHtml(p.risco || "Não informado")}
            </p>

            <p>
                <strong>💊 Alergia:</strong>
                ${escapeHtml(p.alergia || "Nenhuma informada")}
            </p>

            <p>
                <strong>📝 Observação:</strong>
                ${escapeHtml(p.observacao || "Nenhuma")}
            </p>

            <div class="acoes-paciente">
                <button class="btn-atender" onclick="selecionar(${index})">
                    🩺 Atender
                </button>

                <button class="btn-tv" onclick="chamarNaTV(${index})">
                    📺 Chamar na TV
                </button>
            </div>
        `;

        div.appendChild(card);
    });
}

// Quando escolher no SELECT
document.getElementById("paciente").addEventListener("change", function() {

    const index = this.options[this.selectedIndex].dataset.index;

    if (index !== undefined) {
        selecionar(Number(index));
    }
});

function selecionar(index) {

    const paciente = triagensCarregadas[index];

    if (!paciente) {
        alert("Paciente não encontrado.");
        return;
    }

    pacienteSelecionado = paciente.nome || "";

    const select = document.getElementById("paciente");
    select.value = pacienteSelecionado;

    document.getElementById("obs").value =
        paciente.observacao || "";

    document.getElementById("btn-pdf").style.display = "block";

    if (paciente.alergia) {
        alert(
            "⚠️ ATENÇÃO!\n\nAlergia do paciente: " +
            paciente.alergia
        );
    }

    document.querySelector(".consulta-area").scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}

// Abre o seletor de arquivo
function abrirEnvioPDF() {

    if (!pacienteSelecionado) {
        alert("Primeiro selecione um paciente.");
        return;
    }

    document.getElementById("arquivo-pdf").click();
}

// Envia o PDF para o servidor
async function enviarPDF() {

    const input = document.getElementById("arquivo-pdf");
    const arquivo = input.files[0];

    if (!arquivo) return;

    if (arquivo.type !== "application/pdf") {
        alert("Selecione somente um arquivo PDF.");
        input.value = "";
        return;
    }

    const formData = new FormData();

    formData.append("paciente", pacienteSelecionado);
    formData.append("pdf", arquivo);

    try {

        const resposta = await fetch(API + "/pdfs/upload", {
            method: "POST",
            body: formData
        });

        const resultado = await resposta.json();

        if (!resposta.ok) {
            throw new Error(resultado.erro || "Erro ao enviar PDF.");
        }

        alert("✅ PDF enviado com sucesso!");

        input.value = "";

    } catch (erro) {

        console.error(erro);

        alert(
            "❌ Não foi possível enviar o PDF.\n\n" +
            erro.message
        );

    }
}

async function chamarNaTV(index) {

    const paciente = triagensCarregadas[index];

    if (!paciente) return;

    const consultorio =
        document.getElementById("consultorio-num").value;

    if (!consultorio) {
        alert("Digite o número do consultório.");
        return;
    }

    try {

        const resposta = await fetch(API + "/tv/chamar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                localTipo: "CONSULTÓRIO",
                localNumero: consultorio,
                paciente: paciente.nome
            })
        });

        if (!resposta.ok) {
            throw new Error("Erro HTTP " + resposta.status);
        }

        alert(
            "📺 " +
            paciente.nome +
            " foi chamado para o consultório " +
            consultorio + "."
        );

    } catch (erro) {
        alert("❌ Não foi possível chamar o paciente na TV.");
    }
}

async function carregarMedicacoes() {

    const select = document.getElementById("medicacao");

    try {

        const resposta =
            await fetch(API + "/lista-medicacoes");

        const medicamentos =
            await resposta.json();

        medicamentos.forEach(medicamento => {

            const option =
                document.createElement("option");

            option.value = medicamento;
            option.textContent = medicamento;

            select.appendChild(option);

        });

    } catch (erro) {

        console.error(
            "Erro ao carregar medicações:",
            erro
        );

    }
}

async function salvar() {

    const paciente =
        document.getElementById("paciente").value;

    const diagnostico =
        document.getElementById("diagnostico").value;

    const medicacao =
        document.getElementById("medicacao").value;

    const obs =
        document.getElementById("obs").value;

    if (!paciente) {
        alert("Selecione um paciente.");
        return;
    }

    if (!diagnostico) {
        alert("Digite o diagnóstico.");
        return;
    }

    try {

        const resposta =
            await fetch(API + "/consulta", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    paciente,
                    diagnostico,
                    medicacao,
                    obs
                })
            });

        if (!resposta.ok) {
            throw new Error("Erro HTTP " + resposta.status);
        }

        alert("✅ Consulta salva com sucesso!");

        document.getElementById("diagnostico").value = "";
        document.getElementById("medicacao").value = "";
        document.getElementById("obs").value = "";

        await carregar();

        document.getElementById("paciente").value = "";
        pacienteSelecionado = "";
        document.getElementById("btn-pdf").style.display = "none";

    } catch (erro) {

        console.error(erro);

        alert("❌ Não foi possível salvar a consulta.");
const resposta = await fetch("/triagens?_" + Date.now());
    }
}

function escapeHtml(valor) {
    return String(valor)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

carregar();
carregarMedicacoes();

setInterval(carregar, 10000);
</script>

</body>
</html>
