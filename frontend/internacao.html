<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internação - Hospital Pro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #172033;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,.10);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .subtitulo {
            text-align: center;
            color: #667085;
            margin-bottom: 25px;
        }

        .internado {
            background: #f8fafc;
            border: 1px solid #dfe6ee;
            border-left: 6px solid #3498db;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .nome {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .leito {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status {
            color: #1e8449;
            font-weight: bold;
        }

        .vazio,
        .erro {
            text-align: center;
            padding: 25px;
            border-radius: 12px;
            background: #f8fafc;
        }

        .erro {
            color: #c0392b;
        }

        .voltar {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: 0;
            border-radius: 9px;
            background: #34495e;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .voltar:hover {
            background: #2c3e50;
        }

        /* =========================
           BOTÃO INTERNAR
        ========================= */

        .btn-internar {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: 0;
            border-radius: 9px;
            background: #27ae60;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-internar:hover {
            background: #219150;
        }

        /* =========================
           JANELA DE INTERNAÇÃO
        ========================= */

        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,.55);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-conteudo {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 35px rgba(0,0,0,.25);
        }

        .modal-conteudo h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .paciente-modal {
            text-align: center;
            color: #667085;
            margin-bottom: 20px;
        }

        .modal-conteudo label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .modal-conteudo input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        .modal-conteudo input:focus {
            border-color: #3498db;
        }

        .botoes-modal {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .botoes-modal button {
            flex: 1;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-confirmar {
            background: #27ae60;
            color: white;
        }

        .btn-confirmar:hover {
            background: #219150;
        }

        .btn-cancelar {
            background: #7f8c8d;
            color: white;
        }

        .btn-cancelar:hover {
            background: #687576;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏥 Pacientes Internados</h1>

    <p class="subtitulo">
        Controle de internação e leitos
    </p>

    <div id="lista">
        <div class="vazio">
            ⏳ Carregando...
        </div>
    </div>

    <button class="voltar" onclick="window.close()">
        ❌ Fechar esta aba
    </button>

</div>


<!-- =========================
     JANELA PARA ESCOLHER LEITO
========================= -->

<div id="modalInternacao" class="modal">

    <div class="modal-conteudo">

        <h2>🏥 Internar Paciente</h2>

        <div id="pacienteModal" class="paciente-modal">
            Paciente
        </div>

        <label for="numeroLeito">
            🛏️ Número do leito
        </label>

        <input
            type="number"
            id="numeroLeito"
            min="1"
            placeholder="Digite o número do leito"
        >

        <div class="botoes-modal">

            <button
                class="btn-confirmar"
                onclick="confirmarInternacao()"
            >
                ✅ Confirmar
            </button>

            <button
                class="btn-cancelar"
                onclick="fecharModal()"
            >
                ❌ Cancelar
            </button>

        </div>

    </div>

</div>


<script>

const API = "";


/* =========================
   PACIENTE SELECIONADO
========================= */

let pacienteParaInternar = "";


/* =========================
   ESCAPAR HTML
========================= */

function escapeHtml(valor) {

    return String(valor ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================
   ABRIR JANELA
========================= */

function abrirInternacao(nomePaciente) {

    pacienteParaInternar = nomePaciente;

    document.getElementById("pacienteModal").innerHTML =
        "👤 Paciente: <strong>" +
        escapeHtml(nomePaciente) +
        "</strong>";

    document.getElementById("numeroLeito").value = "";

    document.getElementById("modalInternacao").style.display = "flex";

    setTimeout(function() {

        document.getElementById("numeroLeito").focus();

    }, 100);

}


/* =========================
   FECHAR JANELA
========================= */

function fecharModal() {

    document.getElementById("modalInternacao").style.display = "none";

    pacienteParaInternar = "";

}


/* =========================
   CONFIRMAR INTERNAÇÃO
========================= */

async function confirmarInternacao() {

    const campoLeito =
        document.getElementById("numeroLeito");

    const valorLeito =
        campoLeito.value.trim();


    if (!valorLeito) {

        alert(
            "⚠️ Informe o número do leito para realizar a internação."
        );

        campoLeito.focus();

        return;
    }


    const leito =
        Number(valorLeito);


    if (!Number.isInteger(leito) || leito <= 0) {

        alert(
            "⚠️ Informe um número de leito válido."
        );

        campoLeito.focus();

        return;
    }


    if (!pacienteParaInternar) {

        alert(
            "⚠️ Nenhum paciente foi selecionado."
        );

        return;
    }


    try {

        const resposta = await fetch(
            API + "/internacoes",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    paciente: pacienteParaInternar,

                    leito: leito

                })
            }
        );


        const texto =
            await resposta.text();


        let dados = {};

        try {

            dados =
                texto ? JSON.parse(texto) : {};

        } catch {

            dados = {};

        }


        if (!resposta.ok) {

            throw new Error(
                dados.erro ||
                dados.error ||
                "Erro HTTP " + resposta.status
            );

        }


        alert(
            "✅ Paciente internado com sucesso!\n\n" +
            "👤 Paciente: " +
            pacienteParaInternar +
            "\n" +
            "🛏️ Leito: " +
            leito
        );


        fecharModal();


        carregarInternacoes();


    } catch (erro) {

        console.error(erro);

        alert(
            "❌ Não foi possível realizar a internação.\n\n" +
            erro.message
        );

    }

}


/* =========================
   CARREGAR INTERNAÇÕES
========================= */

async function carregarInternacoes() {

    const lista =
        document.getElementById("lista");


    try {

        const resposta = await fetch(
            API + "/internacoes?_=" + Date.now()
        );


        if (!resposta.ok) {

            throw new Error(
                "Erro HTTP " + resposta.status
            );

        }


        const internacoes =
            await resposta.json();


        if (
            !Array.isArray(internacoes) ||
            internacoes.length === 0
        ) {

            lista.innerHTML = `
                <div class="vazio">
                    🏥 Nenhum paciente internado.
                </div>
            `;

            return;
        }


        lista.innerHTML = "";


        internacoes.forEach(internacao => {

            const data =
                internacao.createdAt
                    ? new Date(
                        internacao.createdAt
                    ).toLocaleString("pt-BR")
                    : "Data não informada";


            const nomePaciente =
                internacao.paciente ||
                "Paciente";


            const card =
                document.createElement("div");


            card.className =
                "internado";


            card.innerHTML = `

                <div class="nome">
                    👤 ${escapeHtml(nomePaciente)}
                </div>

                <div class="leito">
                    🛏️ Leito ${
                        escapeHtml(
                            internacao.leito ||
                            "Não informado"
                        )
                    }
                </div>

                <div class="status">
                    🟢 Internado
                </div>

                <div>
                    📅 ${escapeHtml(data)}
                </div>

                <button
                    class="btn-internar"
                    onclick='abrirInternacao(${JSON.stringify(nomePaciente)})'
                >
                    🛏️ Internar
                </button>

            `;


            lista.appendChild(card);

        });


    } catch (erro) {

        console.error(erro);


        lista.innerHTML = `

            <div class="erro">

                ❌ Não foi possível carregar
                as internações.

                <br><br>

                ${escapeHtml(erro.message)}

            </div>

        `;

    }

}


/* =========================
   FECHAR CLICANDO FORA
========================= */

document.getElementById("modalInternacao")
    .addEventListener("click", function(event) {

        if (event.target === this) {

            fecharModal();

        }

    });


/* =========================
   ENTER PARA CONFIRMAR
========================= */

document.getElementById("numeroLeito")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            confirmarInternacao();

        }

    });


/* =========================
   INICIAR
========================= */

carregarInternacoes();


/* Atualiza a lista a cada 5 segundos */

setInterval(
    carregarInternacoes,
    5000
);

</script>

</body>
</html>
